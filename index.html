
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cinema - Stage 6 Editor</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:Arial;padding:12px}
h2{font-size:16px} h3{font-size:13px;color:#aaa}
#preview{width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
#preview video{width:100%;height:100%;object-fit:cover}
#previewText{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-weight:900;font-size:22px;text-shadow:2px 2px 0 #000}
.slots{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0}
.slot{background:#1a1a1a;border:2px dashed #333;border-radius:10px;padding:10px;min-height:78px;cursor:pointer}
.slot.active{border-color:#ffcc00;background:#2a2200}
.slot.filled{border-style:solid;border-color:#00d26a}
.slot small{color:#aaa;display:block;font-size:11px}
.slot b{font-size:12px}
.clip{background:#222;border-radius:8px;padding:8px;cursor:pointer;border:1px solid #333}
.clip img{width:100%;border-radius:6px}
.toolbar{display:flex;gap:8px;overflow-x:auto;padding:8px 0}
.toolbar button{background:#222;color:#fff;border:1px solid #444;padding:10px 14px;border-radius:20px;white-space:nowrap}
#timeline{background:#111;border-radius:10px;padding:10px;display:flex;gap:6px;overflow-x:auto}
.timeline-clip{background:#333;padding:10px 12px;border-radius:8px;font-size:12px;white-space:nowrap}
.timeline-clip.active{background:#ffcc00;color:#000}
input[type=file]{margin:8px 0}
</style>
</head>
<body>

<h2>🎬 CINEMA - STAGE 6: EDITING</h2>
<h3>Zed Gambit - Drag clips into slots</h3>

<div id="preview">
  <span id="previewPlaceholder">Tap a Slot, Then Tap a Clip Below</span>
  <video id="video" controls style="display:none"></video>
  <div id="previewText"></div>
</div>

<div class="toolbar">
  <button onclick="splitClip()">✂️ Split</button>
  <button onclick="addText()">🔤 Add Text</button>
  <button onclick="setFilter('grayscale(1)')">⬛ B&W Filter</button>
  <button onclick="setFilter('sepia(0.6)')">🎞️ Vintage</button>
  <button onclick="setFilter('none')">✨ Clear Filter</button>
  <button onclick="setSpeed(0.5)">0.5x</button>
  <button onclick="setSpeed(1)">1x</button>
  <button onclick="setSpeed(2)">2x</button>
  <button onclick="exportMovie()">⬆️ Export</button>
</div>

<h3>SCENE SLOTS - Your Story Order</h3>
<div class="slots" id="slots"></div>

<h3>TIMELINE - Fine Edit</h3>
<div id="timeline"></div>

<h3>YOUR CLIPS - From Stage 4 / 5</h3>
<input type="file" accept="video/*" multiple onchange="uploadClips(event)">
<div class="slots" id="library"></div>

<script>
const slotNames = [
  "1. INTRO - Themba in Lusaka",
  "2. FIRST GAME - Loses",
  "3. TRAINING MONTAGE",
  "4. FINAL - Zed Gambit Cup",
  "5. WIN - Checkmate",
  "6. END CARD - Logo"
];
let slots = Array(6).fill(null);
let clips = [
  {name:"Themba in Market", url:"", thumb:"https://images.unsplash.com/photo-1528819622765-d6bcf132f793?w=300"},
  {name:"Chess Move", url:"", thumb:"https://images.unsplash.com/photo-1529699211952-734e80c4d42b?w=300"},
  {name:"Training", url:"", thumb:"https://images.unsplash.com/photo-1542751371-adc38448a05e?w=300"},
  {name:"Tournament Crowd", url:"", thumb:"https://images.unsplash.com/photo-1511882150382-421056c89033?w=300"},
];
let selectedSlot = 0;
let videoEl = document.getElementById('video');

function render(){
  document.getElementById('slots').innerHTML = slotNames.map((n,i)=>`
    <div class="slot ${selectedSlot===i?'active':''} ${slots[i]?'filled':''}" onclick="selectSlot(${i})">
      <small>${n}</small>
      <b>${slots[i]?slots[i].name:'+ Empty - Tap to Fill'}</b>
    </div>`).join('');
  document.getElementById('library').innerHTML = clips.map((c,i)=>`
    <div class="clip" onclick="placeClip(${i})">
      <img src="${c.thumb}"><b>${c.name}</b><small>Tap to place in Slot ${selectedSlot+1}</small>
    </div>`).join('');
  document.getElementById('timeline').innerHTML = slots.map((s,i)=>`
    <div class="timeline-clip ${selectedSlot===i?'active':''}" onclick="selectSlot(${i})">
      ${s? '▶ '+s.name : '○ Empty Slot '+(i+1)}
    </div>`).join('');
}
function selectSlot(i){ selectedSlot=i; render(); showPreview(); }
function placeClip(i){
  slots[selectedSlot]=clips[i];
  render(); showPreview();
  if(selectedSlot<5) selectedSlot++;
  render();
}
function showPreview(){
  let c = slots[selectedSlot];
  if(c && c.url){ videoEl.style.display='block'; videoEl.src=c.url; videoEl.play(); document.getElementById('previewPlaceholder').style.display='none'; }
  else if(c){ document.getElementById('previewPlaceholder').innerText='Preview: '+c.name+' - (Demo clip, upload real video to play)'; }
}
function uploadClips(e){
  [...e.target.files].forEach(f=>{
    let url = URL.createObjectURL(f);
    clips.push({name:f.name, url:url, thumb:'https://images.unsplash.com/photo-1529699211952-734e80c4d42b?w=300'});
  });
  render();
}
function splitClip(){ alert('Split: Slot '+(selectedSlot+1)+' will be cut into 2 clips at current playhead. In full version this creates Slot '+(selectedSlot+1)+'A + B'); }
function addText(){ let t = prompt('Text for this scene?','Checkmate. Zed Gambit!'); if(t) document.getElementById('previewText').innerText=t; }
function setFilter(f){ videoEl.style.filter=f; }
function setSpeed(s){ videoEl.playbackRate=s; alert('Speed: '+s+'x'); }
function exportMovie(){
  let filled = slots.filter(s=>s).length;
  alert('Exporting '+filled+'/6 slots...\n16:9 for YouTube + 9:16 for TikTok will be created.\nNext: Go to Stage 7 for Poster + Trailer');
}
render();
</script>
</body>
</html>
